name: Android APK
on:
  push:
    paths:
      - 'android/**'
      - 'scripts/build-android-assets.mjs'
      - '.github/workflows/android.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'worker/**'
      - 'data/**'
      - 'assets/**'
      - 'pwa/**'
      - 'source.mjs'
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build a stable-key APK from main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle APEX assets
        run: node scripts/build-android-assets.mjs
      - name: Build Android APK
        run: gradle -p android --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Verify APK signature
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk APEX-For-the-FANS.apk
          sha256sum APEX-For-the-FANS.apk > APEX-For-the-FANS.apk.sha256
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p android --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APEX-Android-test-build
          path: |
            APEX-For-the-FANS.apk
            APEX-For-the-FANS.apk.sha256
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Build and verify the signed release APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main'
        env:
          APEX_ANDROID_SIGNING_STORE: ${{ secrets.APEX_ANDROID_SIGNING_STORE }}
          APEX_ANDROID_SIGNING_PASSWORD: ${{ secrets.APEX_ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APEX_ANDROID_SIGNING_STORE:?Signing keystore secret is missing}"
          : "${APEX_ANDROID_SIGNING_PASSWORD:?Signing password secret is missing}"
          export APEX_ANDROID_KEYSTORE="$(mktemp --suffix=.p12)"
          trap 'rm -f "$APEX_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$APEX_ANDROID_SIGNING_STORE" | base64 --decode > "$APEX_ANDROID_KEYSTORE"
          unset APEX_ANDROID_SIGNING_STORE
          gradle -p android --no-daemon assembleRelease
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk APEX-For-the-FANS-release.apk
          sha256sum APEX-For-the-FANS-release.apk > APEX-For-the-FANS-release.apk.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.signed_release && github.ref == 'refs/heads/main'
        with:
          name: APEX-Android-signed-release
          path: |
            APEX-For-the-FANS-release.apk
            APEX-For-the-FANS-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
