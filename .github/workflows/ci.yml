name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node build.mjs --standalone
      - run: node scripts/test-all.mjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apex-f1 .
      - run: |
          docker run -d --name apex-smoke -p 4173:4173 apex-f1
          curl --retry 12 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://localhost:4173/healthz
          curl --fail http://localhost:4173/manifest.webmanifest
      - if: failure()
        run: docker logs apex-smoke
      - if: always()
        run: docker rm -f apex-smoke